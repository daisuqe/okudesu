<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>OKUDESU</title>
<link rel="icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="OKUDESU">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #050812;
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #scoreName { user-select: text; -webkit-user-select: text; -webkit-touch-callout: default; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #hud { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #startScreen { position: fixed; inset: 0; pointer-events: none; }
  #startScreen[hidden] { display: none; }
  #appsBtn { position: absolute; top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right));
    width: 32px; height: 32px; padding: 0; margin: 0; border: 0; background: none; opacity: .7; cursor: pointer;
    pointer-events: auto; -webkit-tap-highlight-color: transparent; }
  #appsBtn:hover { opacity: 1; }
  #appsBtn:focus { outline: none; }
  #appsBtn:focus-visible { opacity: 1; outline: 2px solid #fff; outline-offset: 4px; }
  #appsBtn canvas { position: static; width: 32px; height: 32px; image-rendering: pixelated; image-rendering: crisp-edges; display: block; }
  #appsModal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: flex; align-items: center; justify-content: center;
    padding: 16px; box-sizing: border-box; z-index: 10; }
  #appsModal[hidden] { display: none; }
  #appsPanel { width: min(380px, 100%); box-sizing: border-box; background: rgba(10,12,17,.9); border: 1px solid #4a5570; border-radius: 10px;
    color: #d6dae2; text-align: center; padding: 24px 20px 20px; font-family: system-ui, sans-serif; }
  #appsMsg { white-space: pre-line; margin: 0 0 20px; font-size: 15px; line-height: 1.7; }
  #appsBtns { display: flex; justify-content: center; gap: 16px; }
  #appsBtns button { width: 110px; height: 36px; box-sizing: border-box; background: transparent; color: #00cc33; border: 2px solid #00cc33;
    border-radius: 4px; font-family: VT323, monospace; font-size: 22px; line-height: 1; cursor: pointer; }
  #appsBtns button:hover { color: #00ff33; border-color: #00ff33; }
  #appsBtns button:focus { outline: none; }
  #appsBtns button:focus-visible, #appsBtns button.sel { color: #050812; background: #00ff33; border-color: #00ff33; }
  #scoreModal { position: fixed; inset: 0; z-index: 9; }
  #scoreModal[hidden] { display: none; }
  #scorePanel { position: absolute; left: 50%; top: 57%; transform: translate(-50%, -50%); width: min(380px, calc(100% - 32px));
    box-sizing: border-box; background: rgba(10,12,17,.9); border: 1px solid #4a5570; border-radius: 10px; color: #d6dae2;
    text-align: center; padding: 18px 20px 18px; font-family: VT323, monospace; }
  #scoreTitle { margin: 0 0 12px; font-size: 26px; color: #00ff33; letter-spacing: 1px; }
  #scoreName { width: 100%; box-sizing: border-box; height: 40px; font-family: VT323, monospace; font-size: 26px; text-align: center;
    letter-spacing: 2px; background: #050812; color: #ffe600; border: 2px solid #00cc33; border-radius: 4px; outline: none; }
  #scoreName:focus { border-color: #00ff33; }
  #scoreName[hidden] { display: none; }
  #scoreMsg { min-height: 1.2em; margin: 10px 0 12px; font-size: 19px; color: #d6dae2; }
  #scoreBtns { display: flex; justify-content: center; gap: 16px; }
  #scoreBtns button { width: 110px; height: 36px; box-sizing: border-box; background: transparent; color: #00cc33; border: 2px solid #00cc33;
    border-radius: 4px; font-family: VT323, monospace; font-size: 22px; line-height: 1; cursor: pointer; }
  #scoreBtns button[hidden] { display: none; }
  #scoreBtns button:hover { color: #00ff33; border-color: #00ff33; }
  #scoreBtns button:focus { outline: none; }
  #scoreBtns button:focus-visible, #scoreBtns button:focus { color: #050812; background: #00ff33; border-color: #00ff33; }
  #scoreBtns button:disabled { opacity: .4; cursor: default; }
</style>
</head>

<body>
<canvas id="gl"></canvas>
<canvas id="hud" tabindex="0"></canvas>
<div id="startScreen">
  <button id="appsBtn" type="button" aria-label="App list"><canvas id="appsIcon" width="16" height="16"></canvas></button>
</div>
<div id="scoreModal" hidden>
  <div id="scorePanel" role="dialog" aria-modal="true" aria-labelledby="scoreTitle">
    <p id="scoreTitle"></p>
    <input id="scoreName" type="text" maxlength="12" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="Name">
    <p id="scoreMsg" aria-live="polite"></p>
    <div id="scoreBtns"><button id="scoreB1" type="button"></button><button id="scoreB2" type="button"></button></div>
  </div>
</div>
<div id="appsModal" hidden>
  <div id="appsPanel" role="dialog" aria-modal="true" aria-labelledby="appsMsg">
    <p id="appsMsg"></p>
    <div id="appsBtns">
      <button id="appsYes" type="button">Yes</button>
      <button id="appsNo" type="button">No</button>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegmentsGeometry.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineMaterial.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/lines/LineSegments2.js"></script>
<script src="okudesu_audio.js?v=202611180839"></script>
<script src="okudesu.js?v=202611180839"></script>
</body>
</html>
